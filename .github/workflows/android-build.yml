name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./islam/islamic-app-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21' # <-- هذا هو التغيير
          distribution: 'temurin'

      - name: Install web dependencies
        run: pnpm install

      - name: Build web project
        run: pnpm run build

      - name: Install Capacitor dependencies
        run: pnpm add @capacitor/cli @capacitor/core @capacitor/android

      - name: Initialize Capacitor
        run: npx cap init "Noor El Aslam" "com.radwan.noorelaslam" --web-dir "dist"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noorelaslam-apk
          path: islam/islamic-app-frontend/android/app/build/outputs/apk/debug/app-debug.apk
