name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    # 👇 ده السطر السحري اللي هيحل المشكلة
    # بنقوله: كل الأوامر الجاية دي، نفذها جوه الفولدر ده
    defaults:
      run:
        working-directory: ./islamic-app-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build React App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        # هنا بنحدد مكان الجرادل جوه الفولدر الفرعي
        working-directory: ./islamic-app-frontend/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IslamicApp-Debug
          # المسار الكامل للملف عشان يلاقيه ويرفعه
          path: islamic-app-frontend/android/app/build/outputs/apk/debug/app-debug.apk
