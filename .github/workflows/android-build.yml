name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  debug-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1. الخطوة دي هتكشفلنا الملفات فين بالظبط (عشان منخمنش)
      - name: 🕵️ Detective - Show Me Files
        run: |
          echo "📂 Listing Root Files:"
          ls -la
          echo "--------------------------------"
          echo "🔎 Searching for package.json:"
          find . -name "package.json" -not -path "*/node_modules/*"

      # 2. إحنا هنحاول نبني، بس لو المسار غلط هيبان في الخطوة اللي فوق
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        # بنجرب نسطب في الرئيسية مؤقتاً لحد ما نشوف الخريطة
        run: npm install --legacy-peer-deps

      - name: Build React App
        run: npm run build
