name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: ./islam/islamic-app-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: './islam/islamic-app-frontend/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build React App
        run: pnpm run build

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync

      # 👇 التعديل هنا: خليناها نسخة 21 بدل 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: ./islam/islamic-app-frontend/android
        # تجاهل الأخطاء البسيطة عشان ننجز
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IslamicApp-Debug
          path: islam/islamic-app-frontend/android/app/build/outputs/apk/debug/app-debug.apk
